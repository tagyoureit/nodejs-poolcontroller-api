openapi: 3.0.2
info:
  title: nodejs-poolController API
  description: |-
    API's to access, manage and control your pool equipment.  You can find the main project at [nodejs-poolController](https://github.com/tagyoureit/nodejs-poolController/).
    The data structures are defined in the main app's [wiki](https://github.com/tagyoureit/nodejs-poolController/wiki/Version-6-Data-Structures).

    These api's are `live` in the sense that you can execute any of them against your local nodejs-poolController app(*).  
    1. Select one of the default servers or enter your server:port into the Server Variables area
    1. Open up any endpoint
    1. Click on "Try it out"
    1. If there are Parameters or JSON variables that need to be included in the request, fill them out
    1. Click execute and you can see the live results from your server

    * Note: If you are trying to access your njsPC app on any machine other than `localhost` you will need to connect to it over `https` due to [CORS](https://swagger.io/docs/open-source-tools/swagger-ui/usage/cors/) restrictions.

    There are options for running the API documentation locally on your computer:
    1. You can also download a [Postman collection](https://github.com/tagyoureit/nodejs-poolcontroller-api/blob/master/nodejs-poolcontroller-api.json) you can download and import into your local app.
    1. Download the [YAML](https://github.com/tagyoureit/nodejs-poolcontroller-api/blob/master/nodejs-poolcontroller-api.yaml) and paste it in http://editor.swagger.io
    1. Download a code editor like VSCode and use a [Swagger Preview Extension](https://marketplace.visualstudio.com/items?itemName=Arjun.swagger-viewer)

    Want to help?
    1. Clone the [nodejs-poolcontroller-api repository](https://github.com/tagyoureit/nodejs-poolcontroller-api)
    1. Create a new branch
    1. Make changes
    1. Open a Pull Request
    (Or, just open up an issue and it will get fixed)

  version: 9.0.0

servers:
  - url: "{protocol}://{server}:{port}"
    description: Type in your server address
    variables:
      protocol:
        enum:
          - https
          - http
        default: https
      server:
        default: "server"
      port:
        default: "4201"
  - url: "{protocol}://localhost:4200"
    description: Local Server
    variables:
      protocol:
        enum:
          - http
          - https
        default: http
  - url: "{protocol}://raspberrypi.local:4200"
    description: Default RasPi server name
    variables:
      protocol:
        enum:
          - http
          - https
        default: http
tags:
  - name: state
    description: Endpoints that relate to the current state of your pool
  - name: config
    description: Endpoints that relate to the configuration of your pool
  - name: circuits
    description: API endpoints for operating on all circuits
  - name: features
    description: API endpoints for features
  - name: circuit groups
    description: API endpoints for circuit groups
  - name: light groups
    description: API endpoints for light groups
  - name: lights
    description: API endpoints for setting theme, dimmer, color for individual circuits
  - name: chlorinators
    description: API endpoints for chlorinators
  - name: chem controllers
    description: API endpoints for chemical controllers
  - name: chem dosers
    description: API endpoints for chemical dosers
  - name: bodies
    description: API endpoints for bodies
  - name: valves
    description: API endpoints for valves
  - name: pumps
    description: API endpoints for pumps
  - name: schedules
    description: API endpoints for schedules
  - name: heaters
    description: API endpoints for heaters (to set temps, use body endpoints)
  - name: covers
    description: API endpoints for pool/spa covers
  - name: temps
    description: API endpoints for temperature control
  - name: general
    description: API endpoints for general settings (owner, location, etc)
  - name: custom names
    description: API endpoints for custom names (*Touch only)
  - name: virtual controllers
    description: API endpoints for virtual controllers
  - name: delays
    description: API endpoints for cancelling system delays
  - name: date and time
    description: API endpoints for date and time
  - name: app
    description: API endpoints for setting app options (logger, messages, packetCapture)
  - name: logger
    description: API endpoints for setting app logger options
  - name: packet capture
    description: API endpoints for packet capture
  - name: interfaces
    description: API endpoints for managing interface bindings (rem, mqtt, influx, etc)
  - name: backup
    description: API endpoints for backup and restore
  - name: options
    description: API endpoints for retrieving configuration options
  - name: security
    description: API endpoints for security/session management
  - name: rs485
    description: API endpoints for RS485 port configuration and status

paths:
  # ============================================================
  # STATE ENDPOINTS
  # ============================================================
  /state/{section}:
    get:
      summary: Return a section of the current pool state
      description: Return a section of poolState. Valid sections include all, temps, circuits, features, pumps, chlorinators, schedules, etc.
      tags:
        - state
      parameters:
        - in: path
          name: section
          required: true
          schema:
            type: string
          description: The section of the state to return (e.g. all, temps, circuits, features, pumps, chlorinators, schedules)
      responses:
        "200":
          description: The requested state section
          content:
            application/json:
              schema:
                type: object

  /state/emitAll:
    get:
      summary: Emit all equipment changes via socket
      description: Forces all equipment state to be emitted via socket connections.
      tags:
        - state
      responses:
        "200":
          description: Equipment state emitted
          content:
            application/json:
              schema:
                type: object

  /state/rs485Port/{id}:
    get:
      summary: Return RS485 port status and diagnostics
      description: Returns status, connection info, and packet statistics for the specified RS485 port.
      tags:
        - state
        - rs485
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: RS485 port id (0 for primary)
      responses:
        "200":
          description: RS485 port status object
          content:
            application/json:
              schema:
                type: object
                properties:
                  portId:
                    type: integer
                  enabled:
                    type: boolean
                  netConnect:
                    type: object
                  reconnects:
                    type: integer
                  isOpen:
                    type: boolean
                  mock:
                    type: boolean
                  received:
                    type: object
                    properties:
                      bytes:
                        type: integer
                      success:
                        type: integer
                      failed:
                        type: integer
                      collisions:
                        type: integer
                      rewinds:
                        type: integer
                      failureRate:
                        type: number
                  sent:
                    type: object
                    properties:
                      bytes:
                        type: integer
                      success:
                        type: integer
                      aborted:
                        type: integer
                      retries:
                        type: integer
                      failureRate:
                        type: number

  # --- Circuit State ---
  /state/circuit/{id}:
    get:
      summary: Return an individual circuit state object
      description: Return an individual circuit state object by id.
      tags:
        - state
        - circuits
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The id of the circuit
      responses:
        "200":
          description: Circuit state object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stateCircuit"

  /state/circuit/setState:
    put:
      summary: Set state for a circuit
      description: Set on/off state for a circuit. Send id and isOn (or state) in the body.
      tags:
        - state
        - circuits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                isOn:
                  type: boolean
                state:
                  type: boolean
              required:
                - id
            example:
              id: 6
              isOn: true
      responses:
        "200":
          description: Updated circuit state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stateCircuit"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /state/circuit/toggleState:
    put:
      summary: Toggle state for a circuit
      description: Toggle the on/off state of a circuit by id.
      tags:
        - state
        - circuits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
              required:
                - id
            example:
              id: 6
      responses:
        "200":
          description: Updated circuit state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stateCircuit"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /state/circuit/setTheme:
    put:
      summary: Set theme for a circuit (light)
      description: Set the light theme for a circuit.
      tags:
        - state
        - lights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                theme:
                  type: integer
              required:
                - id
                - theme
            example:
              id: 6
              theme: 1
      responses:
        "200":
          description: Updated circuit state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stateCircuit"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /state/circuit/setDimmerLevel:
    put:
      summary: Set dimmer level for a circuit
      description: Set the dimmer level for a dimmable circuit.
      tags:
        - state
        - lights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                level:
                  type: integer
              required:
                - id
                - level
            example:
              id: 6
              level: 50
      responses:
        "200":
          description: Updated circuit state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stateCircuit"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Light State ---
  /state/light/setTheme:
    put:
      summary: Set theme for a light circuit
      description: Set the light theme for a circuit. Same as /state/circuit/setTheme.
