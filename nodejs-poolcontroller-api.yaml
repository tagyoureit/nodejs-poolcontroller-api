        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /state/light/runCommand:
    put:
      summary: Run a light command
      description: Run an arbitrary command on a light circuit (e.g. colorsync, colorhold, colorrecall, lightthumper).
      tags:
        - state
        - lights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
