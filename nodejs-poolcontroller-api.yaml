      description: Set attributes for a given chlorinator.
      tags:
        - state
        - chlorinators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                poolSetpoint:
                  type: integer
                spaSetpoint:
                  type: integer
                superChlorinate:
                  type: boolean
                superChlorHours:
