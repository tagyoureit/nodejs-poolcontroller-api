  /state/light/setBrightness:
    put:
      summary: Set brightness level for a light
      description: Set the brightness/dimmer level for a light circuit.
      tags:
        - state
        - lights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                level:
                  type: integer
                brightness:
                  type: integer
              required:
                - id
            example:
              id: 6
              level: 75
      responses:
        "200":
          description: Updated circuit state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stateCircuit"

  /state/light/setColor:
    put:
      summary: Set RGB color for a light
      description: Set the RGB color values for a light circuit.
      tags:
        - state
        - lights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                red:
                  type: integer
                green:
                  type: integer
                blue:
                  type: integer
              required:
                - id
            example:
              id: 6
              red: 255
              green: 128
              blue: 0
      responses:
        "200":
          description: Updated circuit state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stateCircuit"

