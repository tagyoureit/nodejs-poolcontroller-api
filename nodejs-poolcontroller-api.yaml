      summary: Set attributes for a chlorinator (deprecated alias)
      description: Duplicate of PUT /state/chlorinator. Use /state/chlorinator instead.
      deprecated: true
      tags:
        - state
        - chlorinators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                poolSetpoint:
                  type: integer
                spaSetpoint:
                  type: integer
                superChlorinate:
                  type: boolean
                superChlorHours:
                  type: integer
              required:
                - id
      responses:
        "200":
          description: Updated chlorinator state
          content:
