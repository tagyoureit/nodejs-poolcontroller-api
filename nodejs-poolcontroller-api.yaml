          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /state/light/{id}/colorSync:
    put:
      summary: Set light to colorSync mode
      description: Set the specified light to colorSync mode.
      tags:
        - state
        - lights
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Light circuit id
      responses:
        "200":
