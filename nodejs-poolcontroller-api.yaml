          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stateFeature"

  /state/feature/setState:
    put:
      summary: Set state for a feature
      description: Set on/off state for a feature. Send id and isOn (or state) in the body.
      tags:
        - state
        - features
      requestBody:
