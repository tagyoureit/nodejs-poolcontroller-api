          description: Updated circuit state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stateCircuit"

  /state/light/{id}/colorRecall:
    put:
      summary: Set light to colorRecall mode
      description: Set the specified light to colorRecall mode.
      tags:
        - state
        - lights
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Light circuit id
      responses:
        "200":
          description: Updated circuit state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stateCircuit"

  /state/light/{id}/lightThumper:
    put:
      summary: Set light to lightThumper mode
      description: Set the specified light to lightThumper mode.
      tags:
        - state
        - lights
      parameters:
        - in: path
          name: id
          required: true
