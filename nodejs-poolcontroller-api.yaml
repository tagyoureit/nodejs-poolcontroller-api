  # --- Body/Temp State ---
  /state/body/heatMode:
    put:
      summary: Set heat mode for a body
      description: Set the heat mode for a body. Accepts body id, circuit id, or name to identify the body. Mode can be numeric or string (off, heater, solar, solarpreferred, etc).
      tags:
        - state
        - bodies
        - temps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                mode:
                  oneOf:
                    - type: integer
                    - type: string
                heatMode:
                  oneOf:
                    - type: integer
                    - type: string
            example:
              id: 1
              mode: 1
      responses:
        "200":
          description: Updated body temp state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stateBodyTemp"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /state/body/setPoint:
    put:
      summary: Set temperature setpoint for a body
      description: Set the heat setpoint and/or cool setpoint for a body. Accepts body id, circuit id, or name.
      tags:
        - state
        - bodies
        - temps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                setPoint:
                  type: integer
                heatSetpoint:
                  type: integer
                coolSetpoint:
                  type: integer
            example:
              id: 1
              heatSetpoint: 100
      responses:
        "200":
          description: Updated body temp state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stateBodyTemp"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

